baseURL = 'https://hrmnjt.dev'
locale = 'en-us'
title = 'hrmnjt.dev'

# Disable taxonomy pages
disableKinds = ['taxonomy', 'term']
disableHugoGeneratorInject = true

# Minification
[minify]
  minifyOutput = true

[permalinks]
  shards = '/:year/:month/:day/:slug/'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = "gruvbox"

[params]
  author = 'hrmnjt'
  description = 'Rough, unpolished thoughts and ideas'
  source_repo = 'https://github.com/hrmnjt/sttp'

# Future sections: keep these off until there is content to publish.
# The homepage fails the build if a disabled section has content.
[params.features]
  wal = false
  meta = false

# Output formats
[outputs]
  home = ['HTML', 'RSS']
  page = ['HTML']
  section = ['HTML', 'RSS']

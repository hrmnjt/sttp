{{- /* Each glyph is its section sketch reduced to an outline and one detail, on the
       sketch's own 96x80 coordinates, so the small and large marks stay one drawing.
       Takes a registry entry (data/kinds.toml); a kind without a glyph draws nothing. */ -}}
{{- with .glyph -}}
<svg class="kind-mark" viewBox="{{ .box }}" width="20" height="20" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="{{ .path }}"/></svg>
{{- end -}}

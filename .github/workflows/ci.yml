# CI only. Cloudflare Pages deploys with plain `hugo`; this workflow does not deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Build
        run: hugo --panicOnWarning --printPathWarnings

      - name: Check publishing structure
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check screenshot runner (no browser required)
        run: |
          npm ci --ignore-scripts
          npm run test:screenshots

      - name: Check local links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}/public"
            --remap "https://hrmnjt.dev file://${{ github.workspace }}/public"
            public
